<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ARAM 내전 오버레이</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="panel">
    <header id="bar">
      <span class="ttl">🗡️ 아수라장 내전</span>
      <span id="phase" class="phase">대기</span>
      <button id="close" title="닫기 (Shift+F5)">✕</button>
    </header>

    <!-- 팀 배정 뷰 (좌우 나란히·반응형) -->
    <section id="view-team" class="view" style="display:none;">
      <div id="tv-band" class="tv-band">내 팀을 설정하세요</div>
      <div class="ta-teams">
        <div class="ta-team blue" id="team1">
          <div class="ta-color-bar"></div>
          <div class="ta-head"><span class="ta-label" id="t1-label">1팀</span><span class="ta-count" id="t1-count"></span></div>
          <ul class="ta-players" id="t1-players"></ul>
        </div>
        <div class="ta-team red" id="team2">
          <div class="ta-color-bar"></div>
          <div class="ta-head"><span class="ta-label" id="t2-label">2팀</span><span class="ta-count" id="t2-count"></span></div>
          <ul class="ta-players" id="t2-players"></ul>
        </div>
      </div>
    </section>

    <!-- 🎒 아이템 사용 뷰 (팀 구성 직전 15초) -->
    <section id="view-item" class="view ui-scroll" style="display:none;">
      <div class="it-timer">
        <div class="it-timer-row"><span class="it-timer-lbl">아이템 사용 시간</span><b id="it-sec">15</b><span class="it-timer-unit">초</span></div>
        <div class="it-bar-track"><div id="it-bar" class="it-bar"></div></div>
      </div>
      <div id="it-body" class="it-body"></div>
      <div id="it-err" class="it-err" style="display:none;"></div>
      <div class="it-note">아이템 구매·활성화 · 강철심장 장착 · 시너지 활성화 — 경기 저장 시 반영</div>
    </section>

    <!-- 🎮 인게임 뷰 (전투 중 — 내 빌드 + 승패 LP) -->
    <section id="view-ingame" class="view ui-scroll" style="display:none;">
      <div id="ig-body"></div>
    </section>

    <!-- 💰 정산 뷰 -->
    <section id="view-settle" class="view ui-scroll" style="display:none;">
      <div id="st-banner" class="st-banner"></div>
      <div id="st-awards" class="st-awards"></div>
      <div id="st-teams" class="st-teams"></div>
      <div id="st-procs" class="st-procs"></div>
      <button id="st-close" class="ui-btn-ghost">확인</button>
    </section>

    <!-- 🗳️ MVP·매너왕 투표 뷰 -->
    <section id="view-vote" class="view ui-scroll" style="display:none;">
      <div id="vt-banner" class="vt-banner"></div>
      <div id="vt-body"></div>
      <div id="vt-progress" class="vt-progress"></div>
    </section>

    <!-- 참가자 명단 뷰(인게임) -->
    <section id="view-roster" class="view">
      <div id="status" class="status">⚔️ 팀짜기 대기 중<br><span class="status-sub">방장이 팀을 짜거나 게임을 시작하면<br>여기에 자동으로 떠요.</span></div>
      <div id="waiting-info" class="waiting-info"></div>
      <div class="section-h" id="roster-h" style="display:none;">참가자 <span id="pcount"></span></div>
      <ul id="players" class="players"></ul>
    </section>

    <footer>Shift+F5 토글 · 헤더 드래그로 이동</footer>
  </div>
  <script src="mock.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
