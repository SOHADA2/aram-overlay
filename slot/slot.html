<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <style>
    * { margin:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:transparent; overflow:hidden; -webkit-user-select:none; }
    /* 팀 컬럼을 감싸는 은은한 네모 테두리(부드러운 펄스) */
    #frame { position:absolute; inset:2px; border:2px solid rgba(24,220,200,0.5); border-radius:9px;
      box-shadow:0 0 9px rgba(24,220,200,0.22), inset 0 0 10px rgba(24,220,200,0.05);
      animation:pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:0.42; } 50% { opacity:0.82; } }
    /* 상단 라벨(작고 반투명하게) */
    #tag { position:absolute; top:0; left:50%; transform:translateX(-50%);
      font-family:'Black Han Sans',sans-serif; font-size:11px; letter-spacing:0.3px; white-space:nowrap;
      padding:3px 11px; border-radius:0 0 9px 9px; color:#04140f;
      background:rgba(22,210,192,0.88); box-shadow:0 2px 8px rgba(0,0,0,0.4); }
    body.t2 #frame { border-color:rgba(255,214,88,0.5);
      box-shadow:0 0 9px rgba(255,214,88,0.22), inset 0 0 10px rgba(255,214,88,0.05); }
    body.t2 #tag { background:rgba(230,195,70,0.9); color:#1a1206; }
  </style>
</head>
<body class="t1">
  <div id="frame"></div>
  <div id="tag">🔷 내 팀</div>
  <script>
    window.api.onSlotTeam(t => {
      document.body.className = t === 2 ? 't2' : 't1';
      document.getElementById('tag').textContent = (t === 2 ? '🔶' : '🔷') + ' 내 팀';
    });
  </script>
</body>
</html>
