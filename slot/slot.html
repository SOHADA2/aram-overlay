<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <style>
    * { margin:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:transparent; overflow:hidden; -webkit-user-select:none; }
    #badge { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:4px;
      font-family:'Black Han Sans',sans-serif; font-size:13px; letter-spacing:0.3px; color:#04140f; border-radius:9px;
      background:rgba(22,210,192,0.9); box-shadow:0 3px 12px rgba(0,0,0,0.45), 0 0 14px rgba(22,210,192,0.45);
      animation:glow 2.2s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity:0.82; } 50% { opacity:1; } }
    body.t2 #badge { background:rgba(230,195,70,0.92); color:#1a1206; box-shadow:0 3px 12px rgba(0,0,0,0.45), 0 0 14px rgba(230,195,70,0.45); }
  </style>
</head>
<body class="t1">
  <div id="badge">◆ 내 팀</div>
  <script>
    window.api.onSlotTeam(t => {
      document.body.className = t === 2 ? 't2' : 't1';
      document.getElementById('badge').textContent = '◆ 내 팀';
    });
  </script>
</body>
</html>
