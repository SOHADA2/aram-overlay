<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
  <style>
    * { margin:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:transparent; overflow:hidden; -webkit-user-select:none; }
    /* 팀 컬럼을 감싸는 네모 테두리 강조 */
    #frame { position:absolute; inset:3px; border:3px solid #14e6d2; border-radius:12px;
      box-shadow:0 0 20px 2px rgba(20,230,210,0.5), inset 0 0 20px rgba(20,230,210,0.12);
      animation:pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:0.55; box-shadow:0 0 12px 1px rgba(20,230,210,0.35), inset 0 0 14px rgba(20,230,210,0.08); }
      50% { opacity:1; box-shadow:0 0 24px 3px rgba(20,230,210,0.6), inset 0 0 22px rgba(20,230,210,0.16); } }
    /* 상단 라벨(테두리 상단에 매달림) */
    #tag { position:absolute; top:0; left:50%; transform:translateX(-50%);
      font-family:'Black Han Sans',sans-serif; font-size:13px; letter-spacing:0.5px; white-space:nowrap;
      padding:5px 14px; border-radius:0 0 11px 11px; color:#04140f;
      background:#14e6d2; box-shadow:0 4px 14px rgba(0,0,0,0.5); }
    body.t2 #frame { border-color:#ffd94f;
      box-shadow:0 0 20px 2px rgba(255,217,79,0.5), inset 0 0 20px rgba(255,217,79,0.14); }
    body.t2 #frame { animation:pulse2 1.5s ease-in-out infinite; }
    @keyframes pulse2 { 0%,100% { opacity:0.55; box-shadow:0 0 12px 1px rgba(255,217,79,0.35), inset 0 0 14px rgba(255,217,79,0.08); }
      50% { opacity:1; box-shadow:0 0 24px 3px rgba(255,217,79,0.6), inset 0 0 22px rgba(255,217,79,0.16); } }
    body.t2 #tag { background:#ffd94f; color:#1a1206; }
  </style>
</head>
<body class="t1">
  <div id="frame"></div>
  <div id="tag">🔷 여기가 내 팀</div>
  <script>
    window.api.onSlotTeam(t => {
      document.body.className = t === 2 ? 't2' : 't1';
      document.getElementById('tag').textContent = (t === 2 ? '🔶' : '🔷') + ' 여기가 내 팀';
    });
  </script>
</body>
</html>
