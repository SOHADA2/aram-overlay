<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>내 정보 · 아수라장 내전</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="../desktop/desktop.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="bg"></div>
  <div id="panel">
    <header id="sbar">
      <span class="s-ttl" id="s-ttl">🗡️ 아수라장 내전</span>
      <span class="s-me" id="s-me" style="display:none;"></span>
      <span class="s-wallet" id="s-wallet" style="display:none;"></span>
      <span class="s-sp" id="s-sp"></span>
      <button id="s-min" class="s-winbtn" title="최소화">–</button>
      <button id="s-close" class="s-winbtn" title="닫기">✕</button>
    </header>

    <!-- 🎮 로그인(입장) — 아이디 선택 -->
    <section id="s-login" class="s-login" style="display:none;">
      <div class="slh"><div class="slh-crest">⚔️</div><div class="slh-title">아수라장 내전</div><div class="slh-sub">SEASON 2 · 내 아이디로 입장</div></div>
      <div class="s-login-box">
        <div class="slb-label">계정 선택</div>
        <select id="s-entry-name"><option value="">— 아이디 선택 —</option></select>
        <button id="s-entry-go" class="ui-btn-gold slb-go" disabled>입장</button>
        <label class="s-host-login" id="s-host-box"><input type="checkbox" id="s-host"><span class="shl-tx"><b>👑 방장으로 입장</b><small>이 오버레이가 경기 저장·정산을 담당</small></span></label>
        <div class="slb-hint">홈페이지에 등록된 <b>본인 닉네임</b>을 고르세요</div>
      </div>
      <div class="app-ver" id="s-ver"></div>
    </section>

    <!-- 로그인 후 — 레일(팀짜기·프로필·기록·랭킹) + 콘텐츠 -->
    <div class="app-shell" id="s-app" style="display:none;">
      <nav class="rail">
        <button class="rail-btn" data-cat="team" id="s-rail-team" style="display:none;"><span class="ri">⚔️</span><span class="rl">팀짜기</span></button>
        <button class="rail-btn on" data-cat="profile"><span class="ri">👤</span><span class="rl">프로필</span></button>
        <button class="rail-btn" data-cat="records"><span class="ri">📋</span><span class="rl">기록</span></button>
        <button class="rail-btn" data-cat="ranking"><span class="ri">🏆</span><span class="rl">랭킹</span></button>
        <button class="rail-btn" data-cat="shop"><span class="ri">🛒</span><span class="rl">상점</span></button>
        <button class="rail-btn" data-cat="lottery"><span class="ri">🎟</span><span class="rl">복권</span></button>
        <button class="rail-btn" data-cat="forge"><span class="ri">⚒️</span><span class="rl">대장간</span></button>
        <button class="rail-btn" data-cat="gacha"><span class="ri">🃏</span><span class="rl">가챠</span></button>
        <button class="rail-btn" data-cat="pass"><span class="ri">🎫</span><span class="rl">패스</span></button>
      </nav>
      <div class="cat">
        <!-- ⚔️ 팀짜기(방장 전용) -->
        <section class="cat-view" id="cat-team">
          <div class="cat-hd">⚔️ 팀 짜기 <span class="cat-hd-sub">방장</span></div>
          <div class="cat-scroll ui-scroll">
            <div id="tb-pick">
              <div class="tb-type" id="tb-type">
                <button type="button" class="tbt-btn on" data-mtype="normal">⚔️ 일반전</button>
                <button type="button" class="tbt-btn" data-mtype="magolla">🥊 막고라</button>
              </div>
              <div class="tb-row">
                <span class="tb-count"><b id="tb-num">0</b>명 선택 <button id="tb-clear" title="전체 선택 해제">해제</button></span>
                <span class="tb-modes">
                  <label><input type="radio" name="tb-mode" value="balance" checked> 밸런스</label>
                  <label><input type="radio" name="tb-mode" value="random"> 랜덤</label>
                </span>
              </div>
              <div id="tb-list" class="tb-list"></div>
              <button id="tb-go" class="btn-gold" disabled>⚔️ 팀 구성 (아이템 15초 후 발표)</button>
              <div class="foot-hint">홈페이지 팀원에겐 <b>아이템 타이머 → 팀 발표</b>가 자동으로 떠요.<br>11명 이상·홀수면 관전자 자동 선정.</div>
            </div>
            <div id="tb-run" style="display:none;">
              <div class="tb-timer"><b id="tb-left">15</b><span>초 — 아이템 사용 시간</span></div>
              <button id="tb-skip" class="btn-ghost">⏭️ 건너뛰고 바로 구성</button>
            </div>
            <div id="tb-done" style="display:none;">
              <div id="tb-result" class="tb-result"></div>
              <button id="tb-again" class="btn-ghost">다시 팀 짜기</button>
            </div>
            <div id="tb-err" class="tb-err" style="display:none;"></div>
          </div>
        </section>
        <section class="cat-view" id="cat-profile" style="display:flex;"><div class="cat-hd">내 프로필<span class="cat-hd-actions"><i class="s-live-dot" id="s-live" style="display:none;" title="방장이면 이 오버레이가 경기 저장·정산을 담당해요"></i><button class="s-change-btn" id="s-change" title="계정 변경">계정 변경</button></span></div><div id="pf-body" class="cat-scroll ui-scroll"></div></section>
        <section class="cat-view" id="cat-records"><div class="cat-hd">최근 기록</div><div id="rc-body" class="cat-scroll ui-scroll"></div></section>
        <section class="cat-view" id="cat-ranking"><div class="cat-hd">랭킹 <span class="cat-hd-sub">SEASON 2</span></div><div id="rk-body" class="cat-scroll ui-scroll"></div></section>
        <section class="cat-view" id="cat-shop"><div class="cat-hd">상점 <span class="cat-hd-sub" id="sh-gold"></span></div><div id="sh-body" class="cat-scroll ui-scroll"></div></section>
        <section class="cat-view" id="cat-lottery"><div class="cat-hd">스크래치 복권 <span class="cat-hd-sub" id="lo-gold"></span></div><div id="lo-body" class="cat-scroll ui-scroll"></div></section>
        <section class="cat-view" id="cat-forge"><div class="cat-hd">대장간 <span class="cat-hd-sub" id="fg-gold"></span></div><div id="fg-body" class="cat-scroll ui-scroll"></div></section>
        <section class="cat-view" id="cat-gacha"><div class="cat-hd">챔피언 가챠 <span class="cat-hd-sub" id="ga-gold"></span></div><div id="ga-body" class="cat-scroll ui-scroll"></div></section>
        <section class="cat-view" id="cat-pass"><div class="cat-hd">시즌 2 패스 <span class="cat-hd-sub" id="ps-lv"></span></div><div id="ps-body" class="cat-scroll ui-scroll"></div></section>
        <!-- 🎟🔨 복권·대장간 = 홈페이지 임베드(오른 3D·긁기 모션·아이템 홈 그대로) -->
        <div id="hp-embed" style="display:none;"><div id="hp-load">홈페이지 불러오는 중…</div></div>
      </div>
    </div>
    <!-- 🥊 막고라 진행 중 배너(하단 스트립) — 배팅/결과는 홈페이지 임베드로 -->
    <div id="mg-bar" style="display:none;">
      <span class="mg-info" id="mg-info"></span>
      <button class="mg-open" id="mg-open">🥊 배팅/결과 열기</button>
      <button class="mg-x" id="mg-x" title="임베드 닫기" style="display:none;">✕</button>
    </div>
    <!-- 🥊 방장 결과 입력(배팅 마감 후) — 승자·요건·증강 3가지 고르면 라이브 권한으로 정산 -->
    <div id="mg-result" style="display:none;">
      <div class="mgr-title">🥊 결과 확정 <span class="mgr-sub">방장 · 라이브 권한</span></div>
      <div class="mgr-label">승자</div>
      <div class="mgr-row" id="mgr-winner"></div>
      <div class="mgr-label">승리 요건</div>
      <div class="mgr-row">
        <button class="mgr-btn" data-k="cond" data-v="tower">🏰 타워 먼저</button>
        <button class="mgr-btn" data-k="cond" data-v="kill2">💀 2킬 먼저</button>
        <button class="mgr-btn" data-k="cond" data-v="cs100">🌾 CS 70</button>
      </div>
      <div class="mgr-label">첫 증강 티어</div>
      <div class="mgr-row">
        <button class="mgr-btn" data-k="aug" data-v="silver">🌙 실버</button>
        <button class="mgr-btn" data-k="aug" data-v="gold">⭐ 골드</button>
        <button class="mgr-btn" data-k="aug" data-v="prisma">💠 프리즘</button>
      </div>
      <div class="mgr-err" id="mgr-err" style="display:none;"></div>
      <button class="mgr-confirm" id="mgr-confirm" disabled>정산 확정</button>
    </div>
  </div>
  <script src="mock.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
