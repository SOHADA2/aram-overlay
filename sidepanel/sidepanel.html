<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>내 정보 · 아수라장 내전</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="../desktop/desktop.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="bg"></div>
  <div id="panel">
    <header id="sbar">
      <span class="s-ttl">🗡️ 내 정보</span>
      <button id="s-close" title="닫기">✕</button>
    </header>
    <div class="app-shell" style="display:flex;">
      <nav class="rail">
        <div class="rail-logo">⚔️</div>
        <button class="rail-btn on" data-cat="profile"><span class="ri">👤</span><span class="rl">프로필</span></button>
        <button class="rail-btn" data-cat="records"><span class="ri">📋</span><span class="rl">기록</span></button>
        <button class="rail-btn" data-cat="ranking"><span class="ri">🏆</span><span class="rl">랭킹</span></button>
      </nav>
      <div class="cat">
        <section class="cat-view" id="cat-profile" style="display:flex;"><div class="cat-hd">내 프로필</div><div id="pf-body" class="cat-scroll ui-scroll"></div></section>
        <section class="cat-view" id="cat-records"><div class="cat-hd">최근 기록</div><div id="rc-body" class="cat-scroll ui-scroll"></div></section>
        <section class="cat-view" id="cat-ranking"><div class="cat-hd">랭킹</div><div id="rk-body" class="cat-scroll ui-scroll"></div></section>
      </div>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
