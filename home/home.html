<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>내전 홈페이지 오버레이</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <div id="bar">
    <span class="ttl">🗡️ 아수라장 내전 · 홈페이지</span>
    <button id="reload" title="새로고침">⟳</button>
    <button id="close" title="닫기 (Shift+F6)">✕</button>
  </div>
  <div id="wrap">
    <div id="loading">홈페이지 불러오는 중…</div>
    <!-- 실제 홈페이지를 그대로 임베드(webview=X-Frame 무시·독립 세션·localStorage 유지) -->
    <webview id="wv" src="https://sohada2.github.io/aram/" partition="persist:aram" allowpopups></webview>
  </div>
  <script src="home.js"></script>
</body>
</html>
