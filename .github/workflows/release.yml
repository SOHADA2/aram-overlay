# 태그(vX.Y.Z) 푸시 → Windows 러너에서 빌드 → GitHub Releases 업로드(자동 업데이트 소스)
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build & publish (electron-builder → GitHub Releases)
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
