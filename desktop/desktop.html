<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>아수라장 내전</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">

    <!-- 🎮 로그인(입장) — 게임 접속 화면 -->
    <section id="entry" class="screen entry" style="display:none;">
      <div class="hero">
        <div class="hero-eyebrow">◇ 칼바람 내전 ◇</div>
        <div class="hero-crest">⚔️</div>
        <h1 class="hero-title">아수라장 내전</h1>
        <div class="hero-s2">SEASON 2</div>
        <div class="hero-sub">인게임 오버레이 · 팀 · 투표 · 정산</div>
      </div>
      <div class="login-box">
        <div class="lb-label">계정 선택</div>
        <select id="entry-name"><option value="">— 아이디 선택 —</option></select>
        <button id="entry-go" class="ui-btn-gold lb-go" disabled>입장 ▸</button>
        <div class="lb-hint">홈페이지에 등록된 <b>본인 닉네임</b>을 고르세요</div>
      </div>
      <div class="entry-foot">롤을 켜면 오버레이가 클라에 자동으로 붙어요 · 트레이 상주</div>
      <div class="app-ver" id="ver-entry"></div>
    </section>

    <!-- 입장 후(홈) — 한 화면에 압축 -->
    <section id="home" class="screen" style="display:none;">
      <div class="home-top">
        <span class="home-logo">⚔️ 아수라장 내전</span>
      </div>

      <div class="user-bar">
        <div class="avatar">🗡️</div>
        <div class="user-info"><span class="u-label">접속 중</span><span class="me-name" id="me-name"></span></div>
        <button id="change-name" class="link">계정 변경</button>
      </div>

      <label class="host-toggle" id="host-box">
        <input type="checkbox" id="is-host">
        <span class="ht-text"><b>👑 나는 방장이에요</b><small>팀 짜기 · 경기 저장(라이브) 자동 담당</small></span>
      </label>

      <div class="stat">
        <div class="row"><span>롤 게임</span><b id="game-state">감지 대기</b></div>
        <div class="row"><span>단축키</span><b>Shift+F5 · F6</b></div>
      </div>

      <button id="tb-open" class="ui-btn-gold home-main" style="display:none;">⚔️ 팀 짜기 (방장)</button>
      <div class="home-sub-row">
        <button id="preview-team" class="ui-btn-ghost">👀 미리보기</button>
        <button id="home-overlay" class="ui-btn-ghost">🌐 홈 오버레이</button>
      </div>
      <button id="open-web" class="ui-btn-ghost home-web">브라우저로 홈페이지 열기</button>
      <div class="home-foot">클라 오른쪽 자동 도킹 · 닫아도 트레이 상주</div>
      <div class="app-ver" id="ver-home"></div>
    </section>

    <!-- ⚔️ 팀 짜기 (방장 전용) — 홈페이지와 완전 연동: 아이템 타이머 15초 → 팀 발표가 홈페이지 유저에게도 그대로 뜸 -->
    <section id="teambuild" class="card" style="display:none;">
      <div class="card-title">⚔️ 팀 짜기 <button id="tb-back" class="link" style="margin-left:auto;">← 홈</button></div>

      <div id="tb-pick">
        <div class="tb-row">
          <span class="tb-count"><b id="tb-num">0</b>명 선택</span>
          <span class="tb-modes">
            <label><input type="radio" name="tb-mode" value="balance" checked> 밸런스</label>
            <label><input type="radio" name="tb-mode" value="random"> 랜덤</label>
          </span>
        </div>
        <div id="tb-list" class="tb-list"></div>
        <button id="tb-go" class="btn-gold" disabled>⚔️ 팀 구성 (아이템 15초 후 발표)</button>
        <div class="foot-hint">홈페이지 팀원들에겐 <b>아이템 구매 타이머 → 팀 발표</b>가 평소처럼 자동으로 떠요.<br>11명 이상·홀수면 관전자가 자동 선정됩니다.</div>
      </div>

      <div id="tb-run" style="display:none;">
        <div class="tb-timer"><b id="tb-left">15</b><span>초 — 아이템 사용 시간</span></div>
        <button id="tb-skip" class="btn-ghost">⏭️ 건너뛰고 바로 팀 구성</button>
      </div>

      <div id="tb-done" style="display:none;">
        <div id="tb-result" class="tb-result"></div>
        <button id="tb-again" class="btn-ghost">다시 팀 짜기</button>
      </div>
      <div id="tb-err" class="tb-err" style="display:none;"></div>
    </section>
  </div>
  <script src="desktop.js"></script>
</body>
</html>
