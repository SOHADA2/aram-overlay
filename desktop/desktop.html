<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>아수라장 내전</title>
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
  <header><span class="ttl">🗡️ 아수라장 내전</span><span class="ver">오버레이 v0.1</span></header>
  <main>
    <!-- 입장 전: 내 아이디 선택 -->
    <section id="entry" style="display:none;">
      <p class="lead">내 아이디를 선택해 입장하세요</p>
      <select id="entry-name"><option value="">— 아이디 선택 —</option></select>
      <button id="entry-go" class="primary" disabled>입장</button>
      <p class="hint">홈페이지에 등록된 <b>본인 닉네임</b>을 고르세요. 오버레이가 "내 팀"을 알아보는 데 써요. (나중에 변경 가능)</p>
    </section>

    <!-- 입장 후 -->
    <section id="home" style="display:none;">
      <div class="me-card">
        <div class="me-info"><span class="me-label">입장</span><span class="me-name" id="me-name"></span></div>
        <button id="change-name" class="link">변경</button>
      </div>

      <label class="host-toggle" id="host-box">
        <input type="checkbox" id="is-host">
        <span class="ht-text"><b>👑 나는 방장이에요</b><small>내전 대기방 방장 — 팀 짜기·진행을 담당해요</small></span>
      </label>

      <div class="card">
        <div class="row"><span>롤 게임</span><b id="game-state">감지 대기</b></div>
        <div class="row"><span>클라 도킹</span><b>자동 (트레이에서 끄기)</b></div>
        <div class="row"><span>단축키</span><b>Shift+F5 · Shift+F6</b></div>
      </div>

      <button id="preview-team" class="primary">👀 팀 배정 미리보기</button>
      <button id="home-overlay" class="ghost">🌐 전체 홈페이지 오버레이 (Shift+F6)</button>
      <button id="open-web" class="ghost">기본 브라우저로 홈페이지 열기</button>
      <p class="hint">롤 클라이언트를 켜면 오버레이가 <b>클라 오른쪽에 자동으로</b> 붙어요. 이 창은 닫아도 트레이에 상주합니다.</p>
    </section>
  </main>
  <script src="desktop.js"></script>
</body>
</html>
