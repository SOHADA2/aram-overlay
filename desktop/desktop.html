<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ARAM 내전 오버레이</title>
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
  <header><span class="ttl">🗡️ ARAM 내전 오버레이</span><span class="ver">v0.1.0</span></header>
  <main>
    <div class="card">
      <div class="row"><span>롤 게임</span><b id="game-state">감지 대기</b></div>
      <div class="row"><span>오버레이</span><b>게임 시작 시 자동 표시</b></div>
      <div class="row"><span>토글 단축키</span><b>Shift + F5</b></div>
    </div>
    <p class="desc">롤 게임에 들어가면 화면 위(오버레이)에 <b>참가자 명단</b>과 홈페이지의 <b>티어·LP</b>가 함께 떠요.
      트레이 아이콘에서 언제든 토글·종료할 수 있어요. 모바일·다른 PC는 홈페이지로 그대로 접속(같은 데이터).</p>
    <button id="open-web" class="primary">🌐 내전 홈페이지 열기</button>
    <p class="hint">borderless(테두리없는창) 모드에서 오버레이가 뜹니다 · 이 창은 닫아도 트레이에 상주해요</p>
  </main>
  <script src="desktop.js"></script>
</body>
</html>
